name: codex-action

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      mode:
        description: Codex task mode.
        type: choice
        default: general
        options:
          - general
          - patch
          - release-prep
      prompt:
        description: Task prompt for Codex.
        required: false
        type: string
      target_ref:
        description: Branch, tag, or SHA to check out. Defaults to the dispatch ref.
        required: false
        type: string
      sandbox:
        description: Codex sandbox mode for manual general/patch tasks.
        type: choice
        default: workspace-write
        options:
          - read-only
          - workspace-write
          - danger-full-access
      create_pr:
        description: Create a pull request when a manual Codex task changes files.
        type: boolean
        default: true
  workflow_run:
    workflows:
      - ci-smoke
    types:
      - completed
  release:
    types:
      - created
      - edited
      - prereleased
      - published
  push:
    tags:
      - "v*"

concurrency:
  group: codex-action-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

env:
  CODEX_RESPONSES_API_ENDPOINT: https://cpa.void0312.com:8443/v1/responses
  CODEX_MODEL: gpt-5.5
  CODEX_EFFORT: xhigh
  CODEX_ARGS: '["--config","disable_response_storage=true","--config","model_providers.codex-action-responses-proxy.service_tier=\"standard\""]'

jobs:
  pr-review:
    name: Codex PR review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Pre-fetch PR base and head refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CPA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-args: ${{ env.CODEX_ARGS }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-actions[bot]
          output-file: ${{ runner.temp }}/codex-pr-review.md
          prompt: |
            Review this pull request for correctness, regressions, missing tests, and security risks.

            Only report high-confidence issues that should block or change the pull request.
            Avoid style-only comments, broad refactors, speculative suggestions, and duplicate findings.

            For each issue:

            - cite the relevant file and line or diff hunk;
            - explain the impact;
            - suggest a concrete fix.

            If you do not find blocking or material issues, say so clearly.

            This is pull request #${{ github.event.pull_request.number }} for ${{ github.repository }}.

            Review only the changes introduced by this pull request.
            Useful local commands include:

            git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Pull request title:
            ${{ github.event.pull_request.title }}

            Pull request body:
            ${{ github.event.pull_request.body }}

      - name: Upload Codex PR review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-pr-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/codex-pr-review.md
          if-no-files-found: ignore

  post-pr-review:
    name: Post Codex PR review
    needs: pr-review
    if: github.event_name == 'pull_request' && needs.pr-review.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment Codex PR review
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.pr-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });

  comment-task:
    name: Codex @codex comment task
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '@codex') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout PR merge commit
        if: github.event.issue.pull_request
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout default branch
        if: ${{ !github.event.issue.pull_request }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CPA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-args: ${{ env.CODEX_ARGS }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-actions[bot]
          output-file: ${{ runner.temp }}/codex-comment-task.md
          prompt: |
            Handle the requested Codex task from a GitHub issue or pull request comment.

            Focus on the user's explicit request. Inspect the repository and relevant context before answering.
            Do not modify files in this comment-task workflow. If the request needs code changes, describe the recommended change or ask the maintainer to run the manual Codex patch workflow.
            Provide a concise answer with any important caveats.

            Repository: ${{ github.repository }}
            Issue or PR number: #${{ github.event.issue.number }}
            Issue or PR title: ${{ github.event.issue.title }}
            Comment author: ${{ github.event.comment.user.login }}

            Triggering comment:
            ----
            ${{ github.event.comment.body }}

      - name: Upload Codex comment task artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-comment-task-${{ github.event.issue.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-comment-task.md
          if-no-files-found: ignore

  post-comment-task:
    name: Post Codex comment task
    needs: comment-task
    if: github.event_name == 'issue_comment' && needs.comment-task.outputs.final_message != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment Codex response
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.comment-task.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });

  manual-task:
    name: Codex manual task
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'release-prep'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CPA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-args: ${{ env.CODEX_ARGS }}
          sandbox: ${{ inputs.sandbox }}
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-actions[bot]
          output-file: ${{ runner.temp }}/codex-manual-task.md
          prompt: |
            Read and follow .github/codex/prompts/manual-task.md.

            Mode: ${{ inputs.mode }}
            Target ref: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref }}

            Task prompt:
            ----
            ${{ inputs.prompt }}

      - name: Upload Codex manual task artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-manual-task-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-manual-task.md
          if-no-files-found: ignore

      - name: Save Codex patch
        if: always()
        run: |
          git add -A
          git diff --cached --binary > "${RUNNER_TEMP}/codex-manual-task.patch"

      - name: Upload Codex patch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-manual-task-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-manual-task.patch
          if-no-files-found: ignore

  create-manual-task-pr:
    name: Create PR from manual Codex task
    needs: manual-task
    if: github.event_name == 'workflow_dispatch' && inputs.mode != 'release-prep' && inputs.create_pr == true && needs.manual-task.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Codex output artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-manual-task-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-manual-task

      - name: Download Codex patch artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-manual-task-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-manual-task

      - name: Create pull request from Codex changes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ inputs.target_ref != '' && inputs.target_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          patch_file="${RUNNER_TEMP}/codex-manual-task/codex-manual-task.patch"
          if [[ ! -s "$patch_file" ]]; then
            echo "Codex did not produce a patch; no pull request will be created."
            exit 0
          fi

          git apply --check "$patch_file"
          git apply "$patch_file"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Codex did not change files; no pull request will be created."
            exit 0
          fi

          if [[ "$TARGET_REF" == refs/heads/* ]]; then
            base_ref="${TARGET_REF#refs/heads/}"
          elif [[ "$TARGET_REF" == refs/* ]]; then
            base_ref="$DEFAULT_BRANCH"
          elif git ls-remote --exit-code --heads origin "$TARGET_REF" >/dev/null 2>&1; then
            base_ref="$TARGET_REF"
          else
            base_ref="$DEFAULT_BRANCH"
          fi

          branch="codex/action-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore: apply Codex action task"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" push --set-upstream origin "$branch"

          if [[ -f "${RUNNER_TEMP}/codex-manual-task/codex-manual-task.md" ]]; then
            body_file="${RUNNER_TEMP}/codex-manual-task/codex-manual-task.md"
          else
            body_file="$(mktemp)"
            printf 'Codex action produced repository changes.\n' > "$body_file"
          fi

          gh pr create \
            --base "$base_ref" \
            --head "$branch" \
            --title "Codex action task" \
            --body-file "$body_file"

  ci-failure-diagnosis:
    name: Codex CI failure diagnosis
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout failed workflow head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download failed workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run view "$RUN_ID" --log > codex-ci-logs.txt || true

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CPA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-args: ${{ env.CODEX_ARGS }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-actions[bot]
          output-file: ${{ runner.temp }}/codex-ci-failure.md
          prompt: |
            Read and follow .github/codex/prompts/ci-failure.md.

            Failed workflow: ${{ github.event.workflow_run.name }}
            Workflow run URL: ${{ github.event.workflow_run.html_url }}
            Head branch: ${{ github.event.workflow_run.head_branch }}
            Head SHA: ${{ github.event.workflow_run.head_sha }}

            The workflow log was saved to codex-ci-logs.txt.

      - name: Upload Codex CI diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-ci-failure-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/codex-ci-failure.md
            codex-ci-logs.txt
          if-no-files-found: ignore

  summarize-ci-failure-diagnosis:
    name: Summarize Codex CI failure diagnosis
    needs: ci-failure-diagnosis
    if: github.event_name == 'workflow_run' && needs.ci-failure-diagnosis.outputs.final_message != ''
    runs-on: ubuntu-latest
    steps:
      - name: Write CI diagnosis summary
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.ci-failure-diagnosis.outputs.final_message }}
        run: |
          {
            echo "## Codex CI Failure Diagnosis"
            echo
            printf '%s\n' "$CODEX_FINAL_MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  release-prep:
    name: Codex release prep
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release-prep')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' && inputs.target_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.CPA_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ env.CODEX_RESPONSES_API_ENDPOINT }}
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-args: ${{ env.CODEX_ARGS }}
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
          allow-bot-users: github-actions[bot]
          output-file: ${{ runner.temp }}/codex-release-prep.md
          prompt: |
            Read and follow .github/codex/prompts/release-prep.md.

            Event: ${{ github.event_name }}
            Ref: ${{ github.ref }}
            SHA: ${{ github.sha }}

            Manual prompt, if provided:
            ----
            ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}

      - name: Upload Codex release prep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-release-prep-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-release-prep.md
          if-no-files-found: ignore
