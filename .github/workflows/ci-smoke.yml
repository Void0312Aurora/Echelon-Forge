name: ci-smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  p5b-windows-qualification:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            CMakeLists.txt
            cmake
            examples
            game
            gym_envs
            include
            packages
            pyproject.toml
            python
            requirements
            scenarios
            scripts
            src
            tests
            tools
            train.py
            evaluate.py
            world_model_train.py
            _world_model_train_impl
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install P5-B Python test dependencies
        run: python -m pip install pytest jsonschema

      - name: Configure P5-B Windows qualification
        run: >-
          cmake -S . -B build-p5b-windows -A x64
          -DBUILD_TESTING=ON
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          -DEF_FETCHCONTENT_REVALIDATE_PINS=OFF

      - name: Build P5-B native qualification targets
        run: >-
          cmake --build build-p5b-windows --config Release --parallel 2
          --target ef_runtime_run_recorder_test ef_runtime_kernel_candidate_test
          ef_runtime_kernel_candidate_parity_test

      - name: Run P5-B native qualification gates
        run: >-
          ctest --test-dir build-p5b-windows -C Release
          -R "^(runtime_run_recorder|runtime_run_recorder_boundary|runtime_kernel_candidate|runtime_kernel_candidate_parity)$"
          --output-on-failure

      - name: Run P5-B receipt and recovery gates
        run: >-
          python -m pytest -q --confcutdir=tests/architecture
          tests/architecture/composition/test_runtime_run_receipt.py

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang-format cmake ninja-build

      - name: Create virtual environment
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip -c requirements/constraints-smoke.txt
          ./.venv/bin/python -m pip install -c requirements/constraints-smoke.txt pytest numpy ruff gymnasium jsonschema

      - name: Run lint gates
        shell: bash
        run: |
          set -euo pipefail
          ./.venv/bin/python -m ruff check .
          base_ref=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          if [[ -n "${base_ref}" && "${base_ref}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            mapfile -d '' cpp_files < <(git diff --name-only -z --diff-filter=ACMR "${base_ref}" HEAD -- '*.cpp' '*.h' '*.hpp')
          else
            echo "No stable base commit found; skipping changed-file clang-format gate."
            cpp_files=()
          fi
          if (( ${#cpp_files[@]} > 0 )); then
            printf '%s\0' "${cpp_files[@]}" | xargs -0 clang-format --dry-run -Werror
          else
            echo "No changed C/C++ files for clang-format gate."
          fi
          if [[ -n "${base_ref}" && "${base_ref}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
            ./.venv/bin/python -m tools.maintenance.internal_code_governance \
              --changed-from "${base_ref}"
          else
            echo "No stable base commit found; skipping incremental internal-code gate."
          fi

      - name: Configure CMake
        run: |
          cmake -S . -B build-workshop -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Install Cordis runtime producer dependencies
        working-directory: packages/cordis-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Cordis runtime producer unit tests
        working-directory: packages/cordis-runtime
        run: npm test

      - name: Build ef_core, ef_py, host lifecycle candidate, and C++ tests
        run: |
          cmake --build build-workshop --target ef_core ef_py ef_runtime_host_candidate_test ef_runtime_run_recorder_test ef_runtime_kernel_candidate_test ef_runtime_kernel_candidate_parity_test ef_test ef_composition_lifecycle_test ef_backend_provider_migration_test ef_composition_evidence_test ef_cordis_runtime_conformance_test -j2

      - name: Run C++ smoke tests
        run: |
          ctest --test-dir build-workshop -R '^(ef_test_all|runtime_host_candidate|runtime_host_candidate_boundary|runtime_run_recorder|runtime_run_recorder_boundary|runtime_kernel_candidate|runtime_kernel_candidate_parity|composition_lifecycle|backend_provider_migration|composition_evidence|cordis_runtime_conformance)$' --output-on-failure

      - name: Run state-transfer and Python mirror contract gates
        run: |
          ./.venv/bin/python -m pytest -q --confcutdir=tests/architecture \
            tests/architecture/composition/test_runtime_state_transfer_candidate_contract.py \
            tests/runtime/test_runtime_episode_mirror.py

      - name: Run Cordis producer and composition architecture gates
        env:
          CMO_BUILD_DIR: build-workshop
        run: |
          ./.venv/bin/python tools/maintenance/simulation_composition_contract.py check
          ./.venv/bin/python tools/maintenance/runtime_composition_evidence_contract.py check
          ./.venv/bin/python -m pytest tests/architecture/composition tests/architecture/runtime_facade/test_backend_provider_migration.py tests/architecture/runtime_facade/test_design_boundary_gates.py -q
          ./.venv/bin/python -m pytest tests/runtime/facade/test_runtime_composition_evidence.py -q

      - name: Validate repo environment
        run: |
          bash tools/maintenance/cmo_env.sh validate

      - name: Run smoke tests
        run: |
          source tools/maintenance/cmo_env.sh
          cmo_python tools/runners/run_pytest_suite.py --suite tests/smoke/ci_smoke_suite.json

      - name: Run JSON contract smoke tests
        run: |
          source tools/maintenance/cmo_env.sh
          cmo_python tools/runners/run_scenario_contract.py --suite tests/smoke/ci_contract_suite.json

      - name: Build and validate isolated wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/cmo-wheelhouse"
          wheel_build="${RUNNER_TEMP}/cmo-wheel-build"
          wheel_venv="${RUNNER_TEMP}/cmo-wheel-venv"
          rm -rf "${wheelhouse}" "${wheel_build}" "${wheel_venv}"
          mkdir -p "${wheelhouse}"

          CMAKE_BUILD_PARALLEL_LEVEL=2 \
            SKBUILD_BUILD_DIR="${wheel_build}" \
            ./.venv/bin/python -m pip wheel . --no-deps --wheel-dir "${wheelhouse}"
          wheel_path="$(find "${wheelhouse}" -maxdepth 1 -type f -name 'cmo-*.whl' -print -quit)"
          test -n "${wheel_path}"

          WHEEL_PATH="${wheel_path}" ./.venv/bin/python - <<'PY'
          import os
          import zipfile

          wheel_path = os.environ["WHEEL_PATH"]
          with zipfile.ZipFile(wheel_path) as archive:
              names = archive.namelist()

          assert any(name.startswith("ef_py") and name.endswith((".so", ".pyd")) for name in names)
          assert any(name == "python/__init__.py" for name in names)
          assert any(name.startswith("gym_envs/scenario_loader/") for name in names)
          assert "examples/agents/red_agent.py" in names
          assert any(name.startswith("examples/config/database/") and name.endswith(".json") for name in names)
          assert "scenarios/test/test_free_fall.json" in names

          forbidden = [
              name
              for name in names
              if name.startswith(("include/", "lib/cmake/"))
              or name.endswith((".a", ".lib"))
              or (name.startswith(("lib/", "bin/")) and "flecs" in name.lower())
          ]
          assert not forbidden, f"wheel contains third-party SDK artifacts: {forbidden}"
          PY

          python -m venv "${wheel_venv}"
          "${wheel_venv}/bin/python" -m pip install --upgrade pip -c requirements/constraints-smoke.txt
          "${wheel_venv}/bin/python" -m pip install --no-deps "${wheel_path}"
          (cd "${RUNNER_TEMP}" && "${wheel_venv}/bin/python" -c \
            'import ef_py; print(ef_py.__file__)')
          "${wheel_venv}/bin/python" -m pip install \
            -c requirements/constraints-smoke.txt \
            numpy gymnasium

          (cd "${RUNNER_TEMP}" && "${wheel_venv}/bin/python" - <<'PY'
          from pathlib import Path

          import ef_py
          import python as cmo_python
          from python.rl.runtime.world_batch_vec_env import WorldBatchVecEnv

          wheel_root = Path(cmo_python.__file__).resolve().parent.parent
          database = wheel_root / "examples" / "config" / "database"
          scenario = wheel_root / "scenarios" / "test" / "test_free_fall.json"
          assert database.is_dir(), database
          assert scenario.is_file(), scenario

          assert hasattr(ef_py, "RuntimeFacade")
          assert hasattr(ef_py, "RuntimeBatchConfig")
          assert hasattr(ef_py, "SafetyRuntimeInputs")
          assert hasattr(ef_py, "compute_execution_observation_batch_numpy")
          assert not hasattr(ef_py, "SimulationKernel")
          assert not hasattr(ef_py, "WorldBatchRuntime")
          assert not hasattr(ef_py, "probe_gpu_device")

          facade = ef_py.RuntimeFacade(ef_py.RuntimeBatchConfig())
          assert facade.world_count() == 0

          env = WorldBatchVecEnv(scenario_path=str(scenario), n_envs=1, step_info_mode="off")
          observation = env.reset()
          assert observation is not None
          step_result = env.step([env.action_space.sample()])
          assert step_result is not None
          assert len(step_result) == 4
          env.close()
          PY
          )
