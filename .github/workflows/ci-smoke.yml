name: ci-smoke

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Create virtual environment
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/python -m pip install pytest numpy

      - name: Configure CMake
        run: |
          cmake -S . -B build-workshop -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build ef_core, ef_py, and C++ tests
        run: |
          cmake --build build-workshop --target ef_core ef_py ef_test -j2

      - name: Run C++ smoke tests
        run: |
          ctest --test-dir build-workshop -R ef_test_all --output-on-failure

      - name: Validate repo environment
        run: |
          bash tools/maintenance/cmo_env.sh validate

      - name: Run smoke tests
        run: |
          source tools/maintenance/cmo_env.sh
          cmo_python tools/runners/run_pytest_suite.py --suite tests/smoke/ci_smoke_suite.json

      - name: Run JSON contract smoke tests
        run: |
          source tools/maintenance/cmo_env.sh
          cmo_python tools/runners/run_scenario_contract.py --suite tests/smoke/ci_contract_suite.json
