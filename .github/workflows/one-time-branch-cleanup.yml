name: one-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: start one-time branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          branches=(
            codex/issue60-dependency-boundaries
            codex/scripted-stack-fixes
            codex/bot-review-source
            codex/long-horizon-governance-architecture
            codex/counterfactual-experiment-prep
            codex/database-scaffold
            codex/root-docs-wip-20261002
            codex/consolidate-branch-cleanup
          )
          for branch in "${branches[@]}"; do
            git push origin --delete "${branch}"
            echo "deleted ${branch}"
          done
      - name: Remove this workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cleanup-repo
          cd cleanup-repo
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-branch-cleanup.yml
          git add -u .github/workflows/one-time-branch-cleanup.yml
          git commit -m "chore: remove one-time branch cleanup workflow"
          git push origin HEAD:main
