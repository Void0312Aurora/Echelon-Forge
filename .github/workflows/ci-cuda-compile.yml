name: ci-cuda-compile

# CUDA-on compile lane (CP-1). The default lanes configure with
# EF_ENABLE_CUDA_EXPERIMENTS off, so the ~6.2k-line CUDA-resident backend and
# the src/gpu device helpers are compiled by no CI job at all. This lane turns
# nvcc on so a device-side compile regression cannot land silently.
#
# What this lane does NOT do, stated explicitly so a green check is not
# over-read:
#   * It does not run the CUDA suites. Hosted runners have no NVIDIA device, so
#     cuda_resident_lifecycle / _replay / _full_window would fail at
#     cudaGetDeviceCount. Runtime validation stays a local, GPU-host step that
#     the promotion program records per iteration.
#   * It does not reproduce the evidence toolchain. The tracked resource and
#     achieved-counter evidence was captured with CUDA 13.0 on an RTX 3090; this
#     lane uses whatever nvcc the runner image ships. It is a rot detector, not
#     an evidence host.
#   * It cannot detect a probe that compiles but no longer does anything -- the
#     retired-to-stub case. That is covered without a toolkit by
#     tests/architecture/build_system/test_cuda_surface_wiring.py.
#
# Triggers are path-scoped rather than every-PR: the lane only has something to
# say when CUDA sources, the CUDA CMake wiring, or this workflow change.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/gpu/**"
      - "src/runtime/facade/internal/cuda_resident/**"
      - "src/runtime/contracts/cuda_resident_*"
      - "src/tools/experimental/cuda_resident/**"
      - "src/tests/test_cuda_resident_*"
      - "CMakeLists.txt"
      - ".github/workflows/ci-cuda-compile.yml"
  pull_request:
    paths:
      - "src/gpu/**"
      - "src/runtime/facade/internal/cuda_resident/**"
      - "src/runtime/contracts/cuda_resident_*"
      - "src/tools/experimental/cuda_resident/**"
      - "src/tests/test_cuda_resident_*"
      - "CMakeLists.txt"
      - ".github/workflows/ci-cuda-compile.yml"
  workflow_dispatch:

jobs:
  cuda-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # nvidia-cuda-toolkit comes from the Ubuntu archive rather than a
      # third-party toolkit action, so the lane adds no new supply-chain
      # dependency. Its nvcc predates the runner's default gcc, so g++-12 is
      # installed and pinned as the CUDA host compiler below; without that pin
      # nvcc rejects the host toolchain outright.
      - name: Install build tools and CUDA toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            gcc-12 g++-12 nvidia-cuda-toolkit

      - name: Record toolchain identity
        run: |
          nvcc --version
          g++-12 --version | head -1
          cmake --version | head -1

      # CMAKE_CUDA_ARCHITECTURES has no project default, and nvcc's own default
      # is not the evidence host's. 86 is pinned to match the RTX 3090 the
      # tracked resource/counter evidence was captured on, so this lane compiles
      # the same device code path that evidence describes.
      - name: Configure with CUDA experiments enabled
        run: |
          cmake -S . -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEF_ENABLE_CUDA_EXPERIMENTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_HOST_COMPILER=g++-12

      # The resident backend and the device helpers are separate surfaces with
      # different semantic standing; both carry .cu sources, so both are built.
      - name: Compile the device surfaces
        run: |
          cmake --build build-cuda --target \
            ef_cuda_resident_backend \
            ef_cuda_resident_full_window_runner \
            ef_gpu_experiments \
            -j2

      # Building the CUDA-only executables link-checks them, which is what
      # catches a probe target naming a source that no longer exists. They are
      # built, never run.
      - name: Link the CUDA-only test and probe targets
        run: |
          cmake --build build-cuda --target \
            ef_cuda_resident_lifecycle_test \
            ef_cuda_resident_replay_test \
            ef_cuda_resident_full_window_test \
            ef_cuda_resident_full_window_cuda_probe \
            ef_cuda_resident_cr2_matrix_cuda_probe \
            ef_cuda_resident_rb9_cuda_probe \
            ef_cuda_resident_resource_probe \
            -j2

      - name: State the runtime boundary
        run: |
          echo "Compile and link only. No NVIDIA device is present on hosted"
          echo "runners, so the cuda_resident_* ctest suites are not run here;"
          echo "their results come from the GPU host recorded per iteration in"
          echo "docs/plan/exact_runtime/cuda_resident_promotion_program_20260808.md."
