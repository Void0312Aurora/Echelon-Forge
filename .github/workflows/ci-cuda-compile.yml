name: ci-cuda-compile

# CUDA-on compile lane. Default jobs leave both optional CUDA surfaces off, so
# this lane turns nvcc on and prevents device-side compile regressions from
# landing silently.
#
# What this lane does NOT do, stated explicitly so a green check is not
# over-read:
#   * It does not run the CUDA suites. Hosted runners have no NVIDIA device, so
#     cuda_resident_lifecycle / _replay / _full_window would fail at
#     cudaGetDeviceCount. Runtime validation remains a GPU-host responsibility.
#
# Triggers are path-scoped rather than every-PR: the lane only has something to
# say when CUDA sources, the CUDA CMake wiring, or this workflow change.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/gpu/**"
      - "src/runtime/facade/internal/cuda_resident/**"
      - "src/runtime/contracts/cuda_resident_*"
      - "src/tests/test_cuda_resident_*"
      - "CMakeLists.txt"
      - ".github/workflows/ci-cuda-compile.yml"
  pull_request:
    paths:
      - "src/gpu/**"
      - "src/runtime/facade/internal/cuda_resident/**"
      - "src/runtime/contracts/cuda_resident_*"
      - "src/tests/test_cuda_resident_*"
      - "CMakeLists.txt"
      - ".github/workflows/ci-cuda-compile.yml"
  workflow_dispatch:

jobs:
  cuda-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # nvidia-cuda-toolkit comes from the Ubuntu archive rather than a
      # third-party toolkit action, so the lane adds no new supply-chain
      # dependency. Its nvcc predates the runner's default gcc, so g++-12 is
      # installed and pinned as the CUDA host compiler below; without that pin
      # nvcc rejects the host toolchain outright.
      - name: Install build tools and CUDA toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            gcc-12 g++-12 nvidia-cuda-toolkit

      - name: Record toolchain identity
        run: |
          nvcc --version
          g++-12 --version | head -1
          cmake --version | head -1

      # CMAKE_CUDA_ARCHITECTURES has no project default. Architecture 86 keeps
      # an Ampere device-code target in compile coverage.
      # Both device surfaces are compiled here, so both flags are enabled: the
      # resident backend sources sit behind EF_ENABLE_CUDA_RESIDENT_BACKEND and
      # the src/gpu helper .cu sources sit behind EF_ENABLE_CUDA_EXPERIMENTS.
      # With only the resident flag, ef_gpu_experiments silently builds its C++
      # fallbacks and the helper device code rots uncompiled.
      - name: Configure with both CUDA surfaces enabled
        run: |
          cmake -S . -B build-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEF_ENABLE_CUDA_RESIDENT_BACKEND=ON \
            -DEF_ENABLE_CUDA_EXPERIMENTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DCMAKE_CUDA_HOST_COMPILER=g++-12

      # The resident backend and the device helpers are separate surfaces with
      # different semantic standing; both carry .cu sources, so both are built.
      - name: Compile the device surfaces
        run: |
          cmake --build build-cuda --target \
            ef_cuda_resident_backend \
            ef_cuda_resident_full_window_runner \
            ef_gpu_experiments \
            -j2

      # The native CUDA tests are linked but not run on the hosted CPU runner.
      - name: Link the CUDA-only test targets
        run: |
          cmake --build build-cuda --target \
            ef_cuda_resident_lifecycle_test \
            ef_cuda_resident_replay_test \
            ef_cuda_resident_full_window_test \
            -j2

      - name: State the runtime boundary
        run: |
          echo "Compile and link only. No NVIDIA device is present on hosted"
          echo "runners, so the cuda_resident_* ctest suites are not run here;"
          echo "runtime execution requires separate GPU-host validation."
