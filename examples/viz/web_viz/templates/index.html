<!DOCTYPE html>
<html>

<head>
    <title>Universal 3D Viz</title>
    <script src="/static/socket.io.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', monospace;
            color: #ddd;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border: 1px solid #444;
            min-width: 250px;
        }

        h3 {
            margin-top: 0;
            color: #00ccff;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .label {
            color: #888;
            margin-right: 15px;
        }

        .value {
            color: #fff;
            font-weight: bold;
        }

        #unit-list {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border: 1px solid #444;
            max-height: 80vh;
            overflow-y: auto;
        }

        .unit-item {
            padding: 5px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 12px;
        }

        .unit-item:hover {
            background: #333;
        }

        .unit-item.active {
            border-left: 3px solid #00ccff;
            background: #222;
        }

        #controls-help {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: #666;
            pointer-events: none;
        }

        #ui-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        button {
            background: #222;
            color: #ccc;
            border: 1px solid #555;
            padding: 8px 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
            color: #fff;
        }

        button.primary {
            border-color: #00ccff;
            color: #00ccff;
        }
    </style>
</head>

<body>
    <div id="overlay">
        <h3>TELEMETRY</h3>
        <div class="data-row"><span class="label">TIME</span><span id="v-time" class="value">0.00 s</span></div>
        <div id="focused-unit-stats">
            <div class="data-row"><span class="label">UNIT</span><span id="v-name" class="value">--</span></div>
            <div class="data-row"><span class="label">ALT (ASL)</span><span id="v-alt" class="value">0.0 m</span></div>
            <div class="data-row"><span class="label">SPEED</span><span id="v-spd" class="value">0.0 m/s</span></div>
            <div class="data-row"><span class="label">HEADING</span><span id="v-hdg" class="value">000</span></div>
            <div class="data-row"><span class="label">PITCH</span><span id="v-pitch" class="value">0.0</span></div>
            <div class="data-row"><span class="label">ROLL</span><span id="v-roll" class="value">0.0</span></div>
        </div>
    </div>

    <div id="unit-list">
        <h3>UNITS</h3>
        <div id="unit-list-content"></div>
    </div>

    <div id="controls-help">[WASD] Camera | [Right-Click] Orbit | [Wheel] Zoom | Click Unit to Focus</div>

    <div id="ui-controls">
        <button id="btn-cam" onclick="toggleCamera()">CAM: CHASE</button>
        <button id="btn-start" class="primary" onclick="startSim()">START</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Config ---
        const SCENE_BG = 0x111111;
        const GRID_COLOR = 0x333333;

        // --- State ---
        let units = new Map(); // id -> { mesh, data, trail }
        let focusedId = null;
        let viewMode = 'CHASE'; // CHASE, FREE
        let cameraOffset = new THREE.Vector3(0, 50, 100);
        let simTime = 0;

        // Input State
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false, Shift: false };
        let simPaused = false;

        // --- Init ThreeJS ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(SCENE_BG);
        scene.fog = new THREE.FogExp2(SCENE_BG, 0.00005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 100000);
        camera.position.set(0, 100, 200);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enabled = false; // Start in Chase

        // --- Environment ---
        const grid = new THREE.GridHelper(50000, 500, GRID_COLOR, 0x222222);
        grid.position.y = -5.0; // Lower grid significantly to prevent z-fighting
        scene.add(grid);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(100, 200, 50);
        scene.add(dirLight);

        // --- Human-only NAV markers (mission / cruise points) ---
        const navGroup = new THREE.Group();
        scene.add(navGroup);
        function clearNavGroup() {
            // Dispose geometries/materials to avoid leaks during episode resets.
            while (navGroup.children.length > 0) {
                const obj = navGroup.children[0];
                navGroup.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }
        }

        // --- Asset Loading ---
        const loader = new GLTFLoader();
        let f16Model = null;
        // --- Load Assets ---
        loader.load('/static/assets/f16.glb', (gltf) => {
            f16Model = gltf.scene;
            f16Model.scale.set(1, 1, 1);

            // Standardize Model Orientation:
            // Source Model faces +X. 
            // We want ALL assets to align with Three.js default forward (-Z).
            // Rotate +90 deg around Y: +X becomes -Z.
            // USER FEEDBACK: Was 180 deg off. So rotate -90 deg instead.
            // Native +X -> Rot -90 -> +Z (South)? 
            // Or Native -X -> Rot -90 -> -Z (North)?
            // Whatever the native state, user asked for 180 flip.
            f16Model.rotation.y = -Math.PI / 2;

            // Wrap in a group so we rotate the group, not the mesh inside (Cleaner)
            const wrapper = new THREE.Group();
            wrapper.add(f16Model);
            f16Model = wrapper;

            console.log("F-16 Asset Loaded and Standardized (Adjusted for 180 flip).");
        });

        // --- Socket ---
        const socket = io({ transports: ['websocket'] });

        window.startSim = function () {
            socket.emit('start_sim');
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-start').innerText = "RUNNING";
        };

        window.toggleCamera = function () {
            viewMode = viewMode === 'CHASE' ? 'FREE' : 'CHASE';
            controls.enabled = (viewMode === 'FREE');
            document.getElementById('btn-cam').innerText = "CAM: " + viewMode;
        };

        window.setFocus = function (id) {
            focusedId = id;
            renderUnitList();
        };

        window.togglePause = function () {
            simPaused = !simPaused;
            if (simPaused) {
                socket.emit('pause_sim');
                document.getElementById('btn-start').innerText = "PAUSED";
            } else {
                socket.emit('resume_sim');
                document.getElementById('btn-start').innerText = "RUNNING";
            }
        };

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true;
            if (e.key === 'Shift') keys.Shift = true;
            if (e.key === ' ') togglePause();
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = false;
            if (e.key === 'Shift') keys.Shift = false;
        });

        // --- Logic ---
        function getOrSpawnUnit(uData) {
            if (units.has(uData.id)) return units.get(uData.id);

            console.log("Spawning Unit:", uData);

            // Spawn
            const group = new THREE.Group();

            // Model
            if (uData.type === 'Aircraft' && f16Model) {
                const modelClone = f16Model.clone();
                group.add(modelClone);

                // Initialize existing flame nodes to invisible
                const exFlame = modelClone.getObjectByName("ExternalFlame");
                const inFlame = modelClone.getObjectByName("InternalFlame");
                if (exFlame) exFlame.visible = false;
                if (inFlame) inFlame.visible = false;
            } else {
                // Fallback geometry - Make it VISIBLE (e.g. Building/Tower)
                // Box 30x60x30
                const geo = new THREE.BoxGeometry(30, 60, 30);
                // geo.rotateX(Math.PI / 2); // Box needs no rotation to stand up? 
                // BoxGeometry creates centered at 0,0,0. Lift it up y/2.
                geo.translate(0, 30, 0);

                const mat = new THREE.MeshLambertMaterial({ color: uData.side === 'Red' ? 0xff0000 : 0xffaa00 });
                group.add(new THREE.Mesh(geo, mat));
            }

            scene.add(group);

            // Trail
            const trailGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(3000 * 3); // 1000 points
            trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            trailGeo.setDrawRange(0, 0);
            const trailMat = new THREE.LineBasicMaterial({ color: 0x00ffff, opacity: 0.5, transparent: true });
            const trail = new THREE.Line(trailGeo, trailMat);
            trail.frustumCulled = false;
            scene.add(trail);

            const unitObj = {
                id: uData.id,
                mesh: group,
                trail: trail,
                trailIdx: 0,
                trailPos: positions,
                trailPos: positions,
                data: uData,
                isNew: true
            };

            units.set(uData.id, unitObj);

            // Auto focus logic: First unit
            if (focusedId === null) focusedId = uData.id;

            renderUnitList();
            return unitObj;
        }

        function updateUnit(uObj, uData) {
            uObj.data = uData;

            // Update Transform
            // Sim (ENU: X=East, Y=North, Z=Up) -> Three (Y-Up: X=East, Y=Up, Z=-North)
            const tx = uData.x;
            const ty = uData.z + (uData.type === 'Aircraft' ? 2.5 : 0); // Z is Up. Add 2.5m for Gear.
            const tz = -uData.y; // Y is North -> -Z

            // LERP for smoothness, but SNAP on first update
            if (uObj.isNew) {
                uObj.mesh.position.copy(new THREE.Vector3(tx, ty, tz));
                uObj.isNew = false;
            } else {
                uObj.mesh.position.lerp(new THREE.Vector3(tx, ty, tz), 0.2);
            }

            // --- FX Updates ---
            const exFlame = uObj.mesh.getObjectByName("ExternalFlame");
            const inFlame = uObj.mesh.getObjectByName("InternalFlame");

            const thr = uData.throttle || 0;
            const abActive = thr > 1.0;

            if (exFlame) {
                exFlame.visible = abActive;
                if (abActive && exFlame.material) {
                    // Pulse opacity if possible (needs transparent material)
                    // If material is shared, clone it first?
                    // For now, just toggle visibility.
                    exFlame.visible = true;
                }
            }
            if (inFlame) {
                inFlame.visible = abActive;
            }
            // Rotation Logic (Unified)
            // ==========================================
            // Principle: All assets are now standardized to Face North (-Z).
            // Sim: Heading 0 = North. Heading 90 = East (CW).
            // Three: Rot 0 = North (-Z). Rot -90 = East (CCW around Y).
            // Formula: RotY = -Heading

            const rad = Math.PI / 180;
            const yawRad = -uData.heading * rad;

            const qYaw = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yawRad);
            // Pitch: Sim +Pitch is Nose Up. RotX + is nose up.
            const qPitch = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), uData.pitch * rad);
            // Roll: Sim +Roll is right wing down.
            const qRoll = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -uData.roll * rad);

            // DEBUG: Log first few frames
            if (simTime < 0.5 && uData.type === 'Aircraft') {
                console.log(`Aircraft '${uData.name}' (Unified): hdg=${uData.heading} -> RotY=${yawRad.toFixed(2)}rad`);
            }

            uObj.mesh.quaternion.slerp(qYaw.multiply(qPitch).multiply(qRoll), 0.2);

            // Update Trail (every 5 frames or distance check)
            const idx = uObj.trailIdx;
            if (idx < 3000) {
                uObj.trailPos[idx * 3] = uObj.mesh.position.x;
                uObj.trailPos[idx * 3 + 1] = uObj.mesh.position.y;
                uObj.trailPos[idx * 3 + 2] = uObj.mesh.position.z;
                uObj.trail.geometry.setDrawRange(0, idx + 1);
                uObj.trail.geometry.attributes.position.needsUpdate = true;
                uObj.trailIdx++;
            }
        }

        function renderUnitList() {
            const list = document.getElementById('unit-list-content');
            list.innerHTML = '';
            units.forEach(u => {
                const div = document.createElement('div');
                div.className = 'unit-item' + (u.id === focusedId ? ' active' : '');
                div.innerText = `[${u.data.id}] ${u.data.name || 'Unit'}`;
                div.onclick = () => setFocus(u.id);
                list.appendChild(div);
            });
        }

        // --- Map Logic ---
        socket.on('map_setup', (data) => {
            console.log("====== MAP SETUP DEBUG ======");
            console.log("Raw zone data received:", JSON.stringify(data.zones, null, 2));
            if (data.zones) {
                data.zones.forEach(zone => {
                    // Create Zone Mesh
                    // Zone uses width/length. 
                    const geo = new THREE.PlaneGeometry(zone.width, zone.length);
                    // Color based on surface - Brighter for visibility
                    let color = 0x666666; // Concrete
                    if (zone.surface === 'Asphalt') color = 0x444444;
                    if (zone.surface === 'SoftDirt') color = 0x8B5a2B;

                    // Use BasicMaterial to ignore lighting issues (make it flat visible)
                    const mat = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });

                    // Base Mesh
                    const geo2 = new THREE.PlaneGeometry(zone.width, zone.length);
                    geo2.rotateX(-Math.PI / 2);
                    const mesh2 = new THREE.Mesh(geo2, mat);

                    // Layering to prevent Z-fighting
                    // Apron (Asphalt) at 0.01
                    // Runway (Concrete) at 0.02
                    let heightOffset = 0.01;
                    if (zone.surface === 'Concrete') heightOffset = 0.02;

                    mesh2.position.set(zone.x, heightOffset, -zone.y);
                    mesh2.rotation.y = -zone.heading * (Math.PI / 180);

                    console.log(`Zone '${zone.name}': sim(x=${zone.x}, y=${zone.y}, hdg=${zone.heading}) -> Three(pos=${mesh2.position.x},${mesh2.position.y},${mesh2.position.z}, rotY=${mesh2.rotation.y.toFixed(2)}rad)`);

                    scene.add(mesh2);

                    // Add Yellow Outline
                    const edges = new THREE.EdgesGeometry(geo2);
                    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffff00 }));

                    // Copy transforms manually since edges don't inherit mesh transform if not child?
                    // Better to make mesh2 a Group or add line as child.
                    mesh2.add(line);
                });
            }
        });

        socket.on('nav_setup', (data) => {
            clearNavGroup();
            if (!data || !data.markers) return;

            // Draw markers (yellow spheres) in the same coordinate mapping as units:
            // Sim (ENU) -> Three (X=East, Y=Up, Z=-North).
            data.markers.forEach(m => {
                const r = (m.radius_m !== undefined) ? m.radius_m : 80.0;
                const color = (m.color !== undefined) ? m.color : 0xffff00;
                const geo = new THREE.SphereGeometry(r, 16, 12);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(m.x, m.z, -m.y);
                navGroup.add(mesh);
            });

            // Optional: connect markers with a thin line for readability.
            if (data.markers.length >= 2) {
                const pts = data.markers.map(m => new THREE.Vector3(m.x, m.z, -m.y));
                const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
                const lineMat = new THREE.LineBasicMaterial({ color: 0xffff00, opacity: 0.5, transparent: true });
                navGroup.add(new THREE.Line(lineGeo, lineMat));
            }
        });

        socket.on('state_update', (state) => {
            simTime = state.tick;
            document.getElementById('v-time').innerText = simTime.toFixed(2) + " s";

            const activeIds = new Set();

            state.units.forEach(uData => {
                activeIds.add(uData.id);
                const uObj = getOrSpawnUnit(uData);
                updateUnit(uObj, uData);

                // Update UI if focused
                if (uData.id === focusedId) {
                    document.getElementById('v-name').innerText = uData.name || uData.id;
                    document.getElementById('v-alt').innerText = uData.z.toFixed(0) + " m";
                    document.getElementById('v-spd').innerText = uData.speed.toFixed(0) + " m/s";
                    document.getElementById('v-hdg').innerText = uData.heading.toFixed(0);
                    document.getElementById('v-pitch').innerText = (uData.pitch || 0).toFixed(1);
                    document.getElementById('v-roll').innerText = (uData.roll || 0).toFixed(1);
                }
            });

            // Cleanup Despawned?
            // For now keep them to avoid flickering if packet loss, or implement TTL.
        });

        // --- Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Camera Logic
            if (viewMode === 'FREE') {
                const dt = 0.016; // Approx
                const baseSpeed = 100.0;
                const speed = keys.Shift ? baseSpeed * 5.0 : baseSpeed;
                const moveDist = speed * dt;

                const fwd = new THREE.Vector3();
                camera.getWorldDirection(fwd);
                fwd.y = 0; // Move on XZ plane by default for WASD
                fwd.normalize();

                const right = new THREE.Vector3();
                right.crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();

                const moveParams = new THREE.Vector3();

                if (keys.w) moveParams.add(fwd);
                if (keys.s) moveParams.add(fwd.clone().negate());
                if (keys.d) moveParams.add(right);
                if (keys.a) moveParams.add(right.clone().negate());

                // Vertical
                if (keys.e) moveParams.y += 1;
                if (keys.q) moveParams.y -= 1;

                if (moveParams.lengthSq() > 0) {
                    moveParams.normalize().multiplyScalar(moveDist);

                    // Move Camera
                    camera.position.add(moveParams);
                    // Move Controls Target too so we orbit around new pos
                    controls.target.add(moveParams);
                }
            } else if (viewMode === 'CHASE' && focusedId && units.has(focusedId)) {
                const target = units.get(focusedId).mesh;

                // Camera Follow Logic
                // Offset relative to target orientation
                const relativeOffset = new THREE.Vector3(0, 30, 80); // Behind and Up
                relativeOffset.applyQuaternion(target.quaternion);

                const camPos = target.position.clone().add(relativeOffset);
                camera.position.lerp(camPos, 0.1);
                camera.lookAt(target.position);
                controls.target.copy(target.position); // Sync Orbit target
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
