<!DOCTYPE html>
<html>

<head>
    <title>CMO Real-Time Visualization</title>
    <!-- Use local static file for reliability -->
    <script src="/static/socket.io.min.js"></script>
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: sans-serif;
            text-align: center;
        }

        canvas {
            background-color: #252526;
            border: 1px solid #444;
            margin-top: 20px;
        }

        #status {
            color: #888;
            margin-bottom: 10px;
        }

        #debug {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>CMO Simulation Stream</h1>
    <div id="controls">
        <button id="startBtn"
            style="padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; cursor: pointer;">Start
            Simulation</button>
    </div>
    <div id="status">Status: Waiting for user to start...</div>
    <div id="debug">Waiting for data...</div>
    <canvas id="simCanvas" width="800" height="600"></canvas>

    <script>
        const socket = io({
            transports: ['websocket', 'polling'] // Force stable transport options
        });
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');

        // Check if SocketIO loaded
        if (typeof io === 'undefined') {
            statusDiv.textContent = 'Error: Socket.IO library failed to load.';
            statusDiv.style.color = 'red';
            throw new Error("Socket.IO not found");
        }

        // Camera State
        let camera = {
            scale: 0.05,       // Pixels per meter
            offsetX: 400,      // Screen X of World Origin (0,0)
            offsetY: 300,      // Screen Y of World Origin (0,0)
            isDragging: false,
            lastX: 0,
            lastY: 0
        };

        // --- Interaction Handlers ---
        canvas.addEventListener('mousedown', (e) => {
            camera.isDragging = true;
            camera.lastX = e.clientX;
            camera.lastY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            camera.isDragging = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (camera.isDragging) {
                const dx = e.clientX - camera.lastX;
                const dy = e.clientY - camera.lastY;
                camera.offsetX += dx;
                camera.offsetY += dy;
                camera.lastX = e.clientX;
                camera.lastY = e.clientY;
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const direction = e.deltaY < 0 ? 1 : -1;
            const factor = (1 + zoomIntensity * direction);

            // Zoom towards mouse pointer
            // 1. Get mouse pos relative to canvas
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // 2. Calculate world pos under mouse before zoom
            // ScreenX = OffsetX + WorldX * Scale
            // WorldX = (ScreenX - OffsetX) / Scale
            const worldX = (mouseX - camera.offsetX) / camera.scale;
            const worldY = (camera.offsetY - mouseY) / camera.scale; // Y is inverted

            // 3. Apply Zoom
            camera.scale *= factor;
            camera.scale = Math.max(0.001, camera.scale); // Min zoom

            // 4. Adjust offset to keep world pos under mouse
            // NewOffsetX = MouseX - WorldX * NewScale
            camera.offsetX = mouseX - worldX * camera.scale;
            camera.offsetY = mouseY + worldY * camera.scale;
        });

        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', () => {
            console.log("Start button clicked");
            socket.emit('start_sim');
            startBtn.disabled = true;
            startBtn.style.background = '#555';
            startBtn.textContent = "Simulation Running...";
        });

        // --- Drawing Loop ---
        socket.on('connect', () => {
            statusDiv.textContent = 'Connected. Click Start to begin.';
            statusDiv.style.color = '#ffff00';
            startBtn.disabled = false; // Re-enable on connect
        });

        socket.on('disconnect', () => {
            statusDiv.textContent = 'Disconnected - Auto Reconnecting...';
            statusDiv.style.color = '#ff0000';
            startBtn.disabled = false;
        });

        socket.on('connect_error', (err) => {
            console.log("Connection Error: ", err);
            statusDiv.textContent = 'Connection Error: ' + err;
        });

        socket.on('state_update', (data) => {
            console.log("Received state_update:", data); // DEBUG
            debugDiv.textContent = `Tick: ${data.tick.toFixed(2)} | Units: ${data.units.length} | Scale: 1px=${(1 / camera.scale).toFixed(1)}m`;

            // clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Debug: Draw a red circle at origin to confirm canvas is working
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(camera.offsetX, camera.offsetY, 5, 0, Math.PI * 2);
            ctx.fill();

            // Draw Grid (Dynamic)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            ctx.beginPath();

            // Calculate visible world bounds for efficient grid drawing
            const gridSize = 1000 * camera.scale; // 1km grid lines
            const startX = camera.offsetX % gridSize;
            const startY = camera.offsetY % gridSize;

            for (let i = startX - gridSize; i < canvas.width; i += gridSize) { ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); }
            for (let i = startY - gridSize; i < canvas.height; i += gridSize) { ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); }
            ctx.stroke();

            // Draw Origin Crosshair
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(camera.offsetX - 10, camera.offsetY); ctx.lineTo(camera.offsetX + 10, camera.offsetY);
            ctx.moveTo(camera.offsetX, camera.offsetY - 10); ctx.lineTo(camera.offsetX, camera.offsetY + 10);
            ctx.stroke();

            // Draw Units
            data.units.forEach(unit => {
                // Map coordinates: ENU (x=East, y=North) -> Screen
                const sx = camera.offsetX + unit.x * camera.scale;
                const sy = camera.offsetY - unit.y * camera.scale; // Invert North to go Up

                // --- Visualizing Sensors (Underlay) ---
                if (unit.sensors) {
                    unit.sensors.forEach(sensor => {
                        ctx.save();
                        ctx.translate(sx, sy);
                        // Rotate to match heading
                        const headingRad = -(unit.heading * Math.PI / 180.0);
                        ctx.rotate(headingRad);

                        ctx.beginPath();
                        const r = sensor.radius * camera.scale;
                        const halfFov = (sensor.fov * Math.PI / 180.0) / 2.0;

                        // Draw Sector
                        ctx.moveTo(0, 0);
                        ctx.arc(0, 0, r, -halfFov, halfFov);
                        ctx.closePath();

                        ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
                        ctx.stroke();
                        ctx.restore();
                    });
                }

                // --- Visualizing Detections (Overlay) ---
                if (unit.detections) {
                    unit.detections.forEach(det => {
                        const target = data.units.find(u => u.id === det.target_id);
                        if (target) {
                            const tx = camera.offsetX + target.x * camera.scale;
                            const ty = camera.offsetY - target.y * camera.scale;

                            ctx.save();
                            ctx.strokeStyle = '#00ff00';
                            ctx.lineWidth = 1;
                            ctx.setLineDash([5, 5]);
                            ctx.beginPath();
                            ctx.moveTo(sx, sy);
                            ctx.lineTo(tx, ty);
                            ctx.stroke();
                            ctx.restore();
                        }
                    });
                }

                ctx.save();
                ctx.translate(sx, sy);

                // Draw Label
                ctx.fillStyle = unit.side === 'Blue' ? '#4488ff' : '#ff4444';
                ctx.font = '12px Arial';
                ctx.fillText(unit.type === 'Missile' ? 'M' : unit.side, 10, -10);

                // Draw HP Bar
                if (unit.max_hp > 0 && unit.hp < unit.max_hp) { // Only show if damaged or explicit
                    const hpPct = Math.max(0, unit.hp / unit.max_hp);
                    const barWidth = 30;
                    const barHeight = 4;
                    const barX = -15;
                    const barY = -25;

                    // Background
                    ctx.fillStyle = '#333';
                    ctx.fillRect(barX, barY, barWidth, barHeight);

                    // Foreground
                    ctx.fillStyle = hpPct > 0.5 ? '#00ff00' : (hpPct > 0.2 ? '#ffff00' : '#ff0000');
                    ctx.fillRect(barX, barY, barWidth * hpPct, barHeight);
                }

                // Draw ID for debug
                // ctx.fillText(unit.id, 10, -25);

                // Rotate for Heading
                const headingRad = -(unit.heading * Math.PI / 180.0);
                ctx.rotate(headingRad);

                // Draw Shape
                ctx.beginPath();
                if (unit.type === 'Missile') {
                    // Small Triangle (Yellow)
                    ctx.fillStyle = '#ffff00';
                    ctx.moveTo(10, 0);
                    ctx.lineTo(-5, 5);
                    ctx.lineTo(-5, -5);
                    ctx.fill();
                } else {
                    // Aircraft (Chevron)
                    ctx.fillStyle = unit.side === 'Blue' ? '#00ccff' : '#ff0000';
                    ctx.moveTo(15, 0);
                    ctx.lineTo(-10, 10);
                    ctx.lineTo(-5, 0);
                    ctx.lineTo(-10, -10);
                    ctx.fill();
                }

                ctx.restore();
            });
        });
    </script>
</body>

</html>
