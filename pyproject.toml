[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "cmo"
version = "0.2.0"
description = "CMO Simulation Engine"
license = "Apache-2.0"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "gymnasium",
  "numpy",
  "pytest",
]
lint = [
  "ruff",
]
rl = [
  "gymnasium",
  "numpy",
  "stable-baselines3",
  "torch",
]
train = [
  "gymnasium",
  "numpy",
  "stable-baselines3",
  "tensorboard",
  "torch",
]
world-model = [
  "numpy",
  "torch",
]
geometry = [
  "numpy",
  "scipy",
  "shapely",
]
dev = [
  "gymnasium",
  "numpy",
  "pytest",
  "ruff",
  "stable-baselines3",
  "tensorboard",
  "torch",
]

[tool.scikit-build]
wheel.packages = ["python", "gym_envs"]
# The P4-C epoch fence is a build-tree/shadow probe, not a maintained package
# surface. Keep it out of wheels even though the broad Python package mapping
# includes the `rl` namespace.
wheel.exclude = [
  "rl/runtime/world_batch/candidate_adapter.py",
  "python/rl/runtime/world_batch/candidate_adapter.py",
]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "governance_audit: governance/evidence audit gate (evidence documents, retained manifests, provenance/signoff records, documentation health); excluded from the developer regression via -m \"not governance_audit\"",
]
